<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>IMPULSA | Tarjeta digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=League+Spartan:wght@700&display=swap" rel="stylesheet" />
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  background: #f2f2f2;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.contenedor {
  position: relative;
  width: 100%;
  max-width: 430px;
  background: #ffffff;
}
.tarjeta {
  width: 100%;
  display: block;
}
.link-area {
  position: absolute;
  display: block;
  z-index: 10;
  text-decoration: none;
  cursor: pointer;
  background: transparent;
  border: none;
  padding: 0;
  overflow: visible;
}
.whatsapp::after,
.instagram::after,
.facebook::after,
.linkedin::after,
.tiktok::after,
.telefono::after {
  content: "";
  position: absolute;
  inset: -14px;
  opacity: 0;
  pointer-events: none;
  border-radius: 999px;
  background: radial-gradient(
    circle,
    rgba(189, 135, 68, 0.38) 0%,
    rgba(189, 135, 68, 0.18) 35%,
    rgba(189, 135, 68, 0.04) 65%,
    rgba(189, 135, 68, 0) 100%
  );
  filter: blur(3px);
  transform: scale(0.7);
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.whatsapp:hover::after,
.instagram:hover::after,
.facebook:hover::after,
.linkedin:hover::after,
.tiktok:hover::after,
.telefono:hover::after {
  opacity: 1;
  transform: scale(1);
}
.whatsapp:active::after,
.instagram:active::after,
.facebook:active::after,
.linkedin:active::after,
.tiktok:active::after,
.telefono:active::after {
  opacity: 1;
  transform: scale(0.9);
}
.whatsapp {
  left: 13.8%;
  top: 69.15%;
  width: 12%;
  height: 4.5%;
}
.instagram {
  left: 29.7%;
  top: 69.15%;
  width: 12%;
  height: 4.5%;
}
.facebook {
  left: 45.3%;
  top: 69.15%;
  width: 12%;
  height: 4.5%;
}
.linkedin {
  left: 45.3%;
  top: 69.15%;
  width: 12%;
  height: 4.5%;
}
.tiktok {
  left: 60.9%;
  top: 69.15%;
  width: 12%;
  height: 4.5%;
}
.telefono {
  left: 76.4%;
  top: 69.15%;
  width: 12%;
  height: 4.5%;
}
.boton-real {
  position: absolute;
  left: 14%;
  width: 72%;
  height: 6.9%;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  text-decoration: none;
  font-size: clamp(15px, 4vw, 22px);
  letter-spacing: 1.2px;
  font-weight: 700;
  font-family: 'League Spartan', 'Poppins', Arial, Helvetica, sans-serif;
  cursor: pointer;
  background: #ffffff;
  color: #164457;
  border: 3px solid #bd8744;
  border-radius: 10px;
  box-shadow: none;
  transition: all 0.22s ease;
}
.guardar-contacto {
  top: 77.45%;
}
.visitar-impulsa {
  top: 85.55%;
}
.boton-real:hover {
  background: #ffffff;
  color: #164457;
  transform: translateY(-2px);
  box-shadow: 0 10px 22px rgba(189, 135, 68, 0.22);
}
.boton-real:active {
  transform: scale(0.98);
  background: #ffffff;
}
@media (max-width: 600px) {
  .contenedor {
    max-width: 100%;
  }
  .boton-real {
    font-size: 19px;
  }
}
.no-encontrada {
  max-width: 430px;
  width: 100%;
  padding: 48px 24px;
  text-align: center;
  color: #164457;
}
.no-encontrada h1 {
  font-size: 20px;
  margin-bottom: 8px;
}
.no-encontrada p {
  color: #555;
  font-size: 14px;
  margin-bottom: 24px;
}
.no-encontrada a {
  display: inline-block;
  padding: 12px 20px;
  border: 2px solid #bd8744;
  border-radius: 6px;
  text-decoration: none;
  color: #164457;
  font-weight: bold;
}
</style>
</head>
<body>
<main class="contenedor" id="app"></main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
